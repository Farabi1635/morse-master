name: morse_master
description: Aplikasi belajar Sandi Morse untuk siswa SMP dan Pramuka.
publish_to: none
version: 1.0.1+2
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.0
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2
  android_intent_plus: ^5.2.0
dev_dependencies:
  flutter_launcher_icons: ^0.14.3
flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#1F4D2B"
  adaptive_icon_foreground: assets/icon/icon_fg.png
